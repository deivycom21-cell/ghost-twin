[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ghost-twin"
version = "0.1.0"
description = "Autonomous simulator of real users, chaos and adversarial testing for local web apps and APIs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ghost-twin contributors" }]
keywords = ["testing", "chaos", "playwright", "fuzzing", "qa", "e2e", "security", "localhost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.45",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
ghost-twin = "ghost_twin.cli:main"

[project.urls]
Homepage = "https://github.com/deivycom21-cell/ghost-twin"
Issues = "https://github.com/deivycom21-cell/ghost-twin/issues"

[tool.hatch.build.targets.wheel]
packages = ["ghost_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: needs a real Chromium (auto-skipped when missing)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"ghost_twin/personas/snapshot.py" = ["E501"]  # embedded JavaScript
